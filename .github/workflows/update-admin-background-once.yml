name: Update JETRIDERS admin background

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-admin-background-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-background:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply dark JETRIDERS admin theme
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          admin_path = Path('admin.html')
          html = admin_path.read_text(encoding='utf-8')
          marker = '/* JETRIDERS FINAL DARK ADMIN THEME */'
          theme = '/* JETRIDERS FINAL DARK ADMIN THEME */\nbody{\n  color:#effff3;\n  background:\n    radial-gradient(circle at 86% 8%,rgba(0,231,101,.19),transparent 30%),\n    radial-gradient(circle at 12% 92%,rgba(0,135,55,.22),transparent 36%),\n    linear-gradient(145deg,#010804 0%,#06170c 48%,#00220d 100%);\n  background-attachment:fixed;\n  position:relative;\n}\nbody::before{\n  content:"";\n  position:fixed;\n  inset:0;\n  z-index:-1;\n  pointer-events:none;\n  background:url(\'logo.jpg\') center 120px/520px auto no-repeat;\n  opacity:.055;\n  filter:grayscale(.15);\n}\nheader{\n  background:linear-gradient(135deg,rgba(0,34,12,.98),rgba(0,112,43,.96));\n  border-bottom:1px solid rgba(0,255,102,.58);\n  box-shadow:0 8px 30px rgba(0,0,0,.48),0 0 28px rgba(0,231,101,.12);\n}\n.card{\n  color:#effff3;\n  background:linear-gradient(145deg,rgba(5,29,13,.96),rgba(2,18,8,.94));\n  border:1px solid rgba(0,231,101,.50);\n  box-shadow:0 16px 38px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.025);\n  backdrop-filter:blur(10px);\n}\nh1,h2{color:#78ff9c}\np,li{color:#e5f8ea}\n.muted{color:#a9cdb4}\nlabel{color:#d8ffe3}\n.section-note{\n  color:#d8ffe3;\n  background:rgba(0,231,101,.075);\n  border-left-color:#00e765;\n}\n.notice.safe{\n  color:#dfffe7;\n  background:rgba(0,126,48,.18);\n  border-color:rgba(0,231,101,.42);\n}\n.notice.danger{\n  color:#ffd9d4;\n  background:rgba(180,35,24,.18);\n  border-color:rgba(255,100,88,.45);\n}\n.quick-nav .btn{box-shadow:0 8px 18px rgba(0,0,0,.25)}\n.preview{\n  color:#effff3;\n  background:rgba(5,25,12,.94);\n  border-color:rgba(0,231,101,.35);\n}\n.preview-name,.size{color:#b7d8c0}\n.progress{background:#0a2612}\n.status.info{background:rgba(23,78,166,.20);color:#d9e8ff;border-color:rgba(88,145,230,.55)}\n.status.success{background:rgba(23,107,54,.23);color:#dfffe8;border-color:rgba(69,198,112,.55)}\n.status.error{background:rgba(154,36,26,.23);color:#ffe0dc;border-color:rgba(239,91,76,.55)}\ninput,select,textarea{\n  color:#102016;\n  background:#f8fffa;\n}\nfooter{color:#b9dbc2}\n'

          if marker not in html:
              if '</style>' not in html:
                  raise RuntimeError('admin.html has no closing style tag')
              html = html.replace('</style>', theme + '\n</style>', 1)
              admin_path.write_text(html, encoding='utf-8')
          PY

      - name: Commit updated background
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Dark background already applied.'
            exit 0
          fi
          git config user.name 'JETRIDERS Website Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add admin.html
          git commit -m 'Update Admin Upload to dark JETRIDERS background'
          git push
