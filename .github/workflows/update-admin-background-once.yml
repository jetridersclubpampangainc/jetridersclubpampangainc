name: Update JETRIDERS admin background

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-admin-background-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-background:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply dark JETRIDERS admin theme
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          admin_path = Path('admin.html')
          html = admin_path.read_text(encoding='utf-8')
          marker = '/* JETRIDERS FINAL DARK ADMIN THEME */'
          encoded = '-color:rgba(88,145,230,.55)}'
          theme = base64.b64decode(encoded).decode('utf-8')

          if marker not in html:
              if '</style>' not in html:
                  raise RuntimeError('admin.html has no closing style tag')
              html = html.replace('</style>', theme + '\n</style>', 1)
              admin_path.write_text(html, encoding='utf-8')
          PY

      - name: Commit updated background
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Dark background already applied.'
            exit 0
          fi
          git config user.name 'JETRIDERS Website Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add admin.html
          git commit -m 'Update Admin Upload to dark JETRIDERS background'
          git push
