name: Apply final JETRIDERS backgrounds

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-final-backgrounds.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-backgrounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update public and admin backgrounds
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def upsert_css(path_name, marker, css):
              path = Path(path_name)
              html = path.read_text(encoding='utf-8')
              start_marker = f'/* {marker} */'
              end_marker = f'/* END {marker} */'
              block = start_marker + '\n' + css.strip() + '\n' + end_marker
              if start_marker in html and end_marker in html:
                  html = re.sub(
                      re.escape(start_marker) + r'[\s\S]*?' + re.escape(end_marker),
                      block,
                      html,
                      count=1
                  )
              else:
                  if '</style>' not in html:
                      raise RuntimeError(f'No style block found in {path_name}')
                  html = html.replace('</style>', block + '\n</style>', 1)
              path.write_text(html, encoding='utf-8')

          public_css = r'''
          html{background:#010704}
          body{
            color:#fff;
            background:
              radial-gradient(circle at 12% 8%,rgba(0,255,102,.18) 0,rgba(0,255,102,0) 28%),
              radial-gradient(circle at 88% 18%,rgba(255,213,74,.08) 0,rgba(255,213,74,0) 24%),
              linear-gradient(rgba(0,10,5,.86),rgba(0,48,19,.92)),
              url('logo.jpg') center/280px repeat fixed;
            background-color:#010704;
          }
          body:before{
            background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,20,8,.36));
          }
          nav{
            background:rgba(0,20,8,.96);
            border-bottom:1px solid rgba(0,255,102,.42);
            box-shadow:0 5px 22px rgba(0,0,0,.40);
            backdrop-filter:blur(10px);
          }
          .card{
            background:linear-gradient(145deg,rgba(0,40,15,.94),rgba(0,19,8,.94));
            border-left-color:#00ff66;
            box-shadow:0 12px 32px rgba(0,0,0,.40),0 0 20px rgba(0,255,102,.08);
            backdrop-filter:blur(8px);
          }
          .person,.document-card,.stat-box,.gallery-card,.ride-card,.past-president-card{
            background:rgba(0,10,5,.70);
            border-color:rgba(0,255,102,.58);
          }
          input,select,textarea{
            background:rgba(255,255,255,.97);
          }
          footer{
            background:linear-gradient(135deg,#001006,#00431a,#001006);
            border-top:1px solid rgba(0,255,102,.45);
          }
          @media(max-width:700px){
            body{background-attachment:scroll;background-size:220px}
          }
          '''

          admin_css = r'''
          html{background:#010704}
          body{
            min-height:100vh;
            background:
              radial-gradient(circle at 14% 8%,rgba(0,231,101,.22) 0,rgba(0,231,101,0) 30%),
              radial-gradient(circle at 86% 12%,rgba(255,213,74,.08) 0,rgba(255,213,74,0) 24%),
              linear-gradient(rgba(0,10,5,.87),rgba(0,43,17,.94)),
              url('logo.jpg') center/260px repeat fixed;
            background-color:#010704;
          }
          header{
            background:linear-gradient(135deg,rgba(0,16,7,.98),rgba(0,112,44,.96),rgba(0,28,11,.98));
            border-bottom:1px solid rgba(0,255,102,.55);
            box-shadow:0 8px 28px rgba(0,0,0,.45);
          }
          .card{
            background:rgba(255,255,255,.96);
            border-color:rgba(0,231,101,.58);
            box-shadow:0 14px 38px rgba(0,0,0,.30);
            backdrop-filter:blur(10px);
          }
          footer{color:#dfffea;text-shadow:0 1px 3px #000}
          @media(max-width:650px){
            body{background-attachment:scroll;background-size:210px}
          }
          '''

          upsert_css('index.html', 'JETRIDERS FINAL PUBLIC BACKGROUND', public_css)
          upsert_css('admin.html', 'JETRIDERS FINAL ADMIN BACKGROUND', admin_css)
          PY

      - name: Commit final backgrounds
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Final backgrounds already applied.'
            exit 0
          fi
          git config user.name 'JETRIDERS Website Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html admin.html
          git commit -m 'Apply final dark green JETRIDERS backgrounds'
          git push
