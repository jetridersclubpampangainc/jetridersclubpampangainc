name: Update JETRIDERS admin background

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-admin-background.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-background:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final dark JETRIDERS background
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('admin.html')
          html = path.read_text(encoding='utf-8')

          marker = '/* JETRIDERS FINAL DARK BACKGROUND */'
          css = r'''
          /* JETRIDERS FINAL DARK BACKGROUND */
          html{background:#020905}
          body{
            min-height:100vh;
            background:
              radial-gradient(circle at 15% 10%,rgba(0,231,101,.25) 0,rgba(0,231,101,0) 30%),
              radial-gradient(circle at 86% 15%,rgba(255,213,74,.10) 0,rgba(255,213,74,0) 26%),
              linear-gradient(rgba(0,12,6,.86),rgba(0,45,18,.94)),
              url('grouppix.png') center top/cover fixed no-repeat;
          }
          header{
            background:linear-gradient(135deg,rgba(0,18,8,.98),rgba(0,112,44,.96),rgba(0,38,15,.98));
            border-bottom:1px solid rgba(0,255,102,.55);
            box-shadow:0 8px 28px rgba(0,0,0,.45);
          }
          .card{
            background:rgba(255,255,255,.96);
            border-color:rgba(0,231,101,.58);
            box-shadow:0 14px 38px rgba(0,0,0,.28);
            backdrop-filter:blur(10px);
          }
          footer{color:#dfffea;text-shadow:0 1px 3px #000}
          @media(max-width:650px){
            body{background-attachment:scroll;background-position:center top}
          }
          /* END JETRIDERS FINAL DARK BACKGROUND */
          '''

          if marker not in html:
              html = html.replace('</style>', css + '\n</style>', 1)
          else:
              start = html.index(marker)
              end_marker = '/* END JETRIDERS FINAL DARK BACKGROUND */'
              end = html.index(end_marker, start) + len(end_marker)
              html = html[:start] + css.strip() + html[end:]

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit background update
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Background already updated.'
            exit 0
          fi
          git config user.name 'JETRIDERS Website Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add admin.html
          git commit -m 'Apply final dark JETRIDERS admin background'
          git push
